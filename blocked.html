<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès refusé</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      max-width: 440px;
      padding: 48px 32px;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      background: #141414;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 12px; }
    p  { font-size: 14px; color: #888; line-height: 1.7; }
    .code {
      display: inline-block;
      margin-top: 20px;
      font-family: monospace;
      font-size: 12px;
      color: #555;
      border: 1px solid #222;
      padding: 6px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚫</div>
    <h1>Accès refusé</h1>
    <p>Ton environnement n'est pas compatible avec cette démo.<br>
       Si tu penses que c'est une erreur, contacte-nous sur Discord.</p>
    <div class="code">ERR_ACCESS_DENIED</div>
  </div>
</body>
</html>
